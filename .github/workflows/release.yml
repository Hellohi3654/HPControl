# Publishes a GitHub release whenever main has a version (AppInfo.Version in src/Common/Protocol.cs) that hasn't
# been released yet: builds on Windows, zips the installer, and writes the zip's SHA-256 into the release notes
# (the app's updater checks it before installing). Pushes that don't change the version do nothing.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(sed -n 's/.*Version = "\([0-9.]*\)".*/\1/p' src/Common/Protocol.cs | head -1)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if gh release view "v$ver" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
  release:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: windows-latest
    env:
      VER: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        shell: pwsh
        run: |
          dotnet build src/Service/Service.csproj -c Release -o out/bin
          if ($LASTEXITCODE) { exit 1 }
          dotnet build src/App/App.csproj -c Release -o out/bin
          if ($LASTEXITCODE) { exit 1 }
      - name: Package
        shell: pwsh
        run: |
          $stage = 'stage/HPControl'
          New-Item -ItemType Directory -Force "$stage/bin" | Out-Null
          Copy-Item installer/* $stage/
          foreach ($f in 'HPControl.exe', 'HPControl.exe.config', 'HPControl.Service.exe', 'HPControl.Service.exe.config') { Copy-Item "out/bin/$f" "$stage/bin/" }
          $zip = "HPControl-$env:VER.zip"
          Compress-Archive -Path $stage -DestinationPath $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = @("Download **$zip**, extract it, and run ``install.cmd``. Already on 1.8.0 or newer? HP Control offers this update itself.", '', "SHA-256: $sha", '')
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## $([regex]::Escape($env:VER))\b.*?(?=^## |\z)")
          if ($m.Success) { $notes += $m.Value.Trim() }
          $notes | Set-Content notes.md -Encoding utf8
          # small manifest the app reads first: a plain download, so it isn't limited like the GitHub API
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases"
          [ordered]@{ version = $env:VER; tag = "v$env:VER"; zip = $zip; url = "$base/download/v$env:VER/$zip"; sha256 = $sha; page = "$base/tag/v$env:VER"; notes = $(if ($m.Success) { $m.Value.Trim() } else { '' }) } |
            ConvertTo-Json | Set-Content latest.json -Encoding utf8
          "ZIP=$zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$env:VER" $env:ZIP latest.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "HP Control $env:VER" --notes-file notes.md
